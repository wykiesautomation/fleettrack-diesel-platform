services:
  - type: worker
    name: assettrack360-rest-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python integration_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assettrack360-db
          property: connectionString

  - type: worker
    name: assettrack360-mqtt-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python mqtt_worker.py
    envVars:
      - key: ASSETTRACK_BASE_URL
        value: https://assettrack360.wykiesautomation.co.za
      - key: MQTT_WORKER_TOKEN
        sync: false
      - key: MQTT_CONNECTOR_ID
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_TOPICS
        value: "#"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
