{% extends 'base.html' %}{% block title %}Archived Assets{% endblock %}{% block body %}<h1>Archived Assets</h1>{% for asset in items %}<section class='panel'><h2>{{asset.name}}</h2><p>{{asset.site.name}} · {{asset.asset_type}}</p><form method='post' action='/assets/{{asset.id}}/restore'><button>Restore Asset</button></form></section>{% else %}<p>No archived assets.</p>{% endfor %}{% endblock %}
