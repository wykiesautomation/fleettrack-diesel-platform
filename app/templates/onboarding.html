{% extends 'base.html' %}{% block body %}<div class="head"><div><span class="eyebrow">QUICK START</span><h1>Create a site and first asset</h1></div></div><form class="panel form-grid" method="post"><label>Site name<input name="site_name" required placeholder="Vanderbijlpark Depot"></label><label>Location<input name="location" placeholder="Gauteng"></label><label>Asset name<input name="asset_name" required placeholder="Diesel Tank 01"></label><label>Asset type<select name="asset_type"><option value="TANK">Tank Level</option><option value="TRACKER">Tracking</option><option value="VIBRATION">Vibration</option><option value="GENERIC">Universal Signals</option></select></label><label>Capacity (optional)<input type="number" step="0.01" name="capacity"></label><button>Create dynamic dashboard</button></form>{% endblock %}
