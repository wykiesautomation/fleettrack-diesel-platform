{% extends "base.html" %}{% block head_extra %}<link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}">{% endblock %}{% block body %}<div class="cmd"><aside class="side"><div class="logo">A360</div><h2>AssetTrack 360</h2><small>Platform Administration</small>{% set ep=request.endpoint %}<a class="{{'active' if ep=='admin.dashboard'}}" href="{{url_for('admin.dashboard')}}">Overview</a><a class="{{'active' if ep in ['admin.customers','admin.customer_detail']}}" href="{{url_for('admin.customers')}}">Customers</a><a class="{{'active' if ep=='admin.users'}}" href="{{url_for('admin.users')}}">Users</a><a class="{{'active' if ep=='admin.subscriptions'}}" href="{{url_for('admin.subscriptions')}}">Subscriptions</a><a class="{{'active' if ep=='admin.payments'}}" href="{{url_for('admin.payments')}}">Payments</a><a class="{{'active' if ep=='admin.invoices'}}" href="{{url_for('admin.invoices')}}">Invoices</a><a class="{{'active' if ep=='admin.devices'}}" href="{{url_for('admin.devices')}}">Devices</a><a class="{{'active' if ep=='admin.support'}}" href="{{url_for('admin.support')}}">Support</a><a class="{{'active' if ep=='admin.audit_log'}}" href="{{url_for('admin.audit_log')}}">Audit Log</a><a class="{{'active' if ep=='admin.settings'}}" href="{{url_for('admin.settings')}}">Platform Settings</a></aside><section class="admin-main">{% block admin %}{% endblock %}</section></div>{% endblock %}
