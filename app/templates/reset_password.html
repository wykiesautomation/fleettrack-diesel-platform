{% extends 'base.html' %}
{% block title %}Reset Password | AssetTrack 360{% endblock %}
{% block content %}
<section style="max-width:520px;margin:48px auto;padding:28px;background:#102a42;border:1px solid #2b5770;border-radius:20px;">
  <div style="color:#00c8e8;font-size:12px;font-weight:900;letter-spacing:1.8px;">SECURE ACCOUNT RECOVERY</div>
  <h1 style="margin:12px 0 10px;">Create a new password</h1>
  <p style="color:#a5c0cd;line-height:1.6;">Resetting password for <strong>{{ email }}</strong>. Use at least 10 characters. This link can only be used once.</p>
  <form method="post" autocomplete="off">
    <label for="password" style="display:block;margin:18px 0 7px;font-weight:700;">New password</label>
    <input id="password" name="password" type="password" minlength="10" required autofocus autocomplete="new-password" style="width:100%;padding:14px;border-radius:11px;border:1px solid #2d607b;background:#071824;color:white;font-size:17px;box-sizing:border-box;">
    <label for="confirm_password" style="display:block;margin:18px 0 7px;font-weight:700;">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password" style="width:100%;padding:14px;border-radius:11px;border:1px solid #2d607b;background:#071824;color:white;font-size:17px;box-sizing:border-box;">
    <button type="submit" style="width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#a4d92f;color:#102000;font-size:16px;font-weight:900;cursor:pointer;">Update password</button>
  </form>
</section>
{% endblock %}
