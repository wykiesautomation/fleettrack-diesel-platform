{% extends 'base.html' %}{% block title %}Edit {{asset.name}} | AssetTrack 360{% endblock %}{% block body %}<div class="head"><div><span class="eyebrow">ASSET SETTINGS</span><h1>Edit {{asset.name}}</h1></div><a class="button ghost" href="/asset/{{asset.id}}">Cancel</a></div><form class="panel form-grid" method="post"><label>Asset name<input name="name" required value="{{asset.name}}"></label><label>Capacity<input name="capacity" type="number" min="0.01" step="0.01" required value="{{asset.capacity or ''}}"></label><label>Capacity unit<select name="capacity_unit"><option value="L" {% if asset.capacity_unit=='L'%}selected{% endif %}>Litres</option><option value="m³" {% if asset.capacity_unit=='m³'%}selected{% endif %}>Cubic metres</option></select></label><label>Tank shape<select name="tank_shape"><option value="vertical_cylinder">Vertical cylinder</option><option value="horizontal_cylinder">Horizontal cylinder</option><option value="rectangular">Rectangular</option><option value="calibration_table">Calibration table</option></select></label><label>Height (mm)<input name="height_mm" type="number" step="0.1" value="{{(asset.metadata_json or {}).get('height_mm') or ''}}"></label><label>Diameter (mm)<input name="diameter_mm" type="number" step="0.1" value="{{(asset.metadata_json or {}).get('diameter_mm') or ''}}"></label><label>Length (mm)<input name="length_mm" type="number" step="0.1" value="{{(asset.metadata_json or {}).get('length_mm') or ''}}"></label><button>Save asset settings</button></form>{% endblock %}
