{% extends 'base.html' %}{% block title %}Register Edge Gateway{% endblock %}{% block head_extra %}<style>.wrap{max-width:760px;margin:auto}.panel{background:#102942;border:1px solid #28516a;border-radius:17px;padding:22px}label{display:block;margin-top:13px;color:#aac0cb;font-size:11px}input,select{display:block;width:100%;margin-top:6px;background:#071724;color:white;border:1px solid #31566c;border-radius:9px;padding:12px}.btn{width:100%;margin-top:18px;background:#00c8e8;border:0;border-radius:9px;padding:13px;font-weight:900}</style>{% endblock %}{% block body %}<div class="wrap"><span class="eyebrow">ONE-TIME PROVISIONING</span><h1>Register Edge Gateway</h1><form class="panel" method="post"><label>Gateway ID<input name="gateway_uid" value="EDGE-SITE01-01" required></label><label>Display name<input name="name" placeholder="Site 01 Plant Gateway" required></label><label>Site<select name="site_id"><option value="">No site assignment</option>{% for s in sites %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><button class="btn">Register and Generate Token</button></form></div>{% endblock %}
