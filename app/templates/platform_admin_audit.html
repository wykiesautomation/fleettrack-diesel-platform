{% extends "platform_admin_base.html" %}{% block admin %}<div class="hero"><h1>Audit Log</h1></div><div class="panel scroll"><table class="table"><tr><th>Date</th><th>Event</th><th>Customer</th><th>Actor</th><th>Summary</th></tr>{% for x in rows %}<tr><td>{{x.created_at.strftime('%d %b %Y %H:%M')}}</td><td>{{x.event_type}}</td><td>#{{x.customer_id}}</td><td>{{x.actor_type}}</td><td>{{x.safe_summary or '-'}}</td></tr>{% endfor %}</table></div>{% endblock %}
