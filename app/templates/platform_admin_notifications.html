{% extends "platform_admin_base.html" %}{% block admin %}<div class="admin-hero"><div><h1>Notifications</h1><p>Live billing and support exceptions requiring attention.</p></div></div><div class="admin-panel"><table class="admin-table"><tr><th>Type</th><th>Item</th><th>Detail</th><th>Date</th><th></th></tr>{% for x in rows %}<tr><td><span class="admin-tag">{{x.type}}</span></td><td>{{x.title}}</td><td>{{x.detail}}</td><td>{{x.created_at}}</td><td><a class="admin-btn" href="{{x.url}}">Open</a></td></tr>{% else %}<tr><td colspan="5">No active notifications.</td></tr>{% endfor %}</table></div>{% endblock %}
