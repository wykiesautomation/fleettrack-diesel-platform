{% extends 'base.html' %}{% block title %}{{asset.name}} Settings{% endblock %}{% block head_extra %}<style>.wrap{max-width:720px;margin:auto}.panel{background:#102942;border:1px solid #28516a;border-radius:17px;padding:22px}label{display:block;margin-top:13px;color:#aac0cb;font-size:11px}input,select{display:block;width:100%;margin-top:6px;background:#071724;color:white;border:1px solid #31566c;border-radius:9px;padding:12px}.btn{width:100%;margin-top:18px;background:#00c8e8;border:0;border-radius:9px;padding:13px;font-weight:900}</style>{% endblock %}{% block body %}<div class="wrap"><span class="eyebrow">ASSET CONFIGURATION</span><h1>{{asset.name}} Settings</h1><form class="panel" method="post"><label>Asset name<input name="name" value="{{asset.name}}" required></label><label>Capacity<input type="number" min="0" step="0.01" name="capacity" value="{{asset.capacity or ''}}"></label><label>Capacity unit<select name="capacity_unit"><option selected>{{asset.capacity_unit or 'L'}}</option><option>L</option><option>m³</option><option>kg</option></select></label><button class="btn">Save Asset Settings</button></form></div>{% endblock %}
