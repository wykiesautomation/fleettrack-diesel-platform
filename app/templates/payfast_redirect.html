<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting to PayFast</title><style>body{margin:0;background:#06131f;color:#edf7fb;font-family:Segoe UI,Arial;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,90%);background:#102942;border:1px solid #28516a;border-radius:20px;padding:30px;text-align:center}.spin{width:50px;height:50px;border:5px solid #24485e;border-top-color:#00c8e8;border-radius:50%;margin:20px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{background:#00c8e8;border:0;border-radius:10px;padding:12px 18px;font-weight:900}</style></head><body><div class="card"><h1>Secure PayFast Checkout</h1><div class="spin"></div><p>Preparing payment {{payment.merchant_payment_id}}.</p><form id="pf" method="post" action="{{endpoint}}">{% for key,value in fields.items() %}<input type="hidden" name="{{key}}" value="{{value}}">{% endfor %}<button>Continue if not redirected</button></form></div><script>setTimeout(()=>document.getElementById('pf').submit(),700)</script></body></html>
