name: FleetTrack Keep Alive

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping-fleettrack:
    runs-on: ubuntu-latest

    steps:
      - name: Wake FleetTrack and verify health
        shell: bash
        run: |
          URL="https://fleettrack-diesel-platform.onrender.com/health"

          echo "Pinging: $URL"

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE=$(curl \
              --location \
              --silent \
              --show-error \
              --output response.txt \
              --write-out "%{http_code}" \
              --max-time 120 \
              "$URL" || true)

            echo "Attempt $attempt returned HTTP $HTTP_CODE"
            cat response.txt || true
            echo

            if [ "$HTTP_CODE" = "200" ]; then
              echo "FleetTrack is healthy."
              exit 0
            fi

            echo "FleetTrack is waking up. Waiting 20 seconds..."
            sleep 20
          done

          echo "FleetTrack did not return HTTP 200 after six attempts."
          exit 1
