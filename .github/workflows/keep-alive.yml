name: AssetTrack 360 Keep Alive

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour to reduce GitHub queue congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assettrack360-render-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wake service and verify health
        shell: bash
        env:
          HEALTH_URL: https://fleettrack.wykiesautomation.co.za/health
        run: |
          set -u

          echo "Checking AssetTrack 360 health endpoint"
          echo "URL: ${HEALTH_URL}"

          for attempt in 1 2 3 4 5 6; do
            http_code=$(curl \
              --location \
              --silent \
              --show-error \
              --output response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 30 \
              --max-time 120 \
              --retry 2 \
              --retry-delay 5 \
              "${HEALTH_URL}" || true)

            echo "Attempt ${attempt}: HTTP ${http_code}"
            head -c 1000 response.txt 2>/dev/null || true
            echo

            if [ "${http_code}" = "200" ]; then
              if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"|"ok"[[:space:]]*:[[:space:]]*true' response.txt; then
                echo "Service is awake and healthy."
                exit 0
              fi

              echo "HTTP 200 received, but the response did not contain the expected health status."
            fi

            if [ "${attempt}" -lt 6 ]; then
              echo "Waiting 20 seconds before retry..."
              sleep 20
            fi
          done

          echo "Health endpoint did not return a valid healthy response."
          exit 1
