services:
  - type: web
    name: assettrack360-rev12
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: assettrack360-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: assettrack360-db
    plan: free
# Add these secret values in Render Dashboard after deploy:
# SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD,
# SMTP_FROM_EMAIL, SMTP_FROM_NAME, SMTP_USE_TLS, SMTP_USE_SSL
# PUBLIC_BASE_URL=https://assettrack360.wykiesautomation.co.za
